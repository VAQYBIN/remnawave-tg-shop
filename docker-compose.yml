services:
  remnawave-tg-shop:
    image: kavore/remnawave-tg-shop:latest
    build: .
    container_name: remnawave-tg-shop
    hostname: remnawave-tg-shop
    env_file:
      - .env
    networks:
      - remnawave-network
    volumes:
      - ./locales:/app/locales
    restart: unless-stopped
    depends_on:
      remnawave-tg-shop-db:
        condition: service_healthy

  remnawave-tg-shop-db:
    image: postgres:17
    container_name: remnawave-tg-shop-db
    hostname: remnawave-tg-shop-db
    env_file:
      - .env
    volumes:
      - remnawave-tg-shop-db-data:/var/lib/postgresql/data
    networks:
      - remnawave-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  remnawave-tg-shop-redis:
    image: redis:7-alpine
    container_name: remnawave-tg-shop-redis
    hostname: remnawave-tg-shop-redis
    networks:
      - remnawave-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  remnawave-tg-shop-web-api:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: remnawave-tg-shop-web-api
    hostname: remnawave-tg-shop-web-api
    env_file:
      - .env
    ports:
      - "8090:8090"
    networks:
      - remnawave-network
    restart: unless-stopped
    depends_on:
      remnawave-tg-shop-db:
        condition: service_healthy
      remnawave-tg-shop-redis:
        condition: service_healthy

  remnawave-tg-shop-web-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${WEB_API_URL:-http://localhost:8090}/api
    container_name: remnawave-tg-shop-web-frontend
    hostname: remnawave-tg-shop-web-frontend
    ports:
      - "3000:3000"
    networks:
      - remnawave-network
    restart: unless-stopped

networks:
  remnawave-network:
    external: false

volumes:
  remnawave-tg-shop-db-data:
    name: remnawave-tg-shop-db-data
