services:
  remnawave-tg-shop:
    image: vaqybin/remnawave-tg-shop:latest
    build: .
    container_name: remnawave-tg-shop
    hostname: remnawave-tg-shop
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    networks:
      - remnawave-network
    volumes:
      - ./locales:/app/locales
    restart: unless-stopped
    depends_on:
      remnawave-tg-shop-db:
        condition: service_healthy
      remnawave-tg-shop-redis:
        condition: service_healthy

  remnawave-tg-shop-db:
    image: postgres:17
    container_name: remnawave-tg-shop-db
    hostname: remnawave-tg-shop-db
    env_file:
      - .env
    volumes:
      - remnawave-tg-shop-db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - remnawave-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  remnawave-tg-shop-redis:
    image: redis:7-alpine
    container_name: remnawave-tg-shop-redis
    hostname: remnawave-tg-shop-redis
    command: redis-server --save 60 1
    volumes:
      - remnawave-tg-shop-redis-data:/data
    networks:
      - remnawave-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  remnawave-tg-shop-web-api:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: remnawave-tg-shop-web-api
    hostname: remnawave-tg-shop-web-api
    env_file:
      - .env
    ports:
      - "8090:8090"
    networks:
      - remnawave-network
    volumes:
      - remnawave-tg-shop-web-static:/app/web/static
      # The Subscription Page app config (Devices/Guide tabs) is pulled live from
      # the panel by default. To override it offline, drop an app-config-v2.json
      # next to this file, mount it, and set SUBSCRIPTION_PAGE_CONFIG_PATH:
      # - ./app-config-v2.json:/app/app-config-v2.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/api/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      remnawave-tg-shop-db:
        condition: service_healthy
      remnawave-tg-shop-redis:
        condition: service_healthy

  remnawave-tg-shop-web-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_URL: ${WEB_API_URL:-http://localhost:8090}/api
    container_name: remnawave-tg-shop-web-frontend
    hostname: remnawave-tg-shop-web-frontend
    ports:
      - "3000:3000"
    networks:
      - remnawave-network
    restart: unless-stopped
    depends_on:
      remnawave-tg-shop-web-api:
        condition: service_healthy

networks:
  remnawave-network:
    name: remnawave-network
    driver: bridge
    external: false

volumes:
  remnawave-tg-shop-db-data:
    name: remnawave-tg-shop-db-data
  remnawave-tg-shop-redis-data:
    name: remnawave-tg-shop-redis-data
  remnawave-tg-shop-web-static:
    name: remnawave-tg-shop-web-static
