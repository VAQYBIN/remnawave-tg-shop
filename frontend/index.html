<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VPN Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="/env-config.js"></script>
    <script>
      // Anti-flash: apply the stored colour-scheme preference before React mounts.
      // (Palette colours still load with branding; this just avoids a light/dark flash.)
      try {
        var pref = localStorage.getItem('color-scheme-pref');
        var dark = pref === 'dark' ||
          ((pref === 'system' || pref === null) &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches && pref === 'system');
        if (dark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
