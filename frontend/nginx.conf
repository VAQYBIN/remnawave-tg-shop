server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config is regenerated on every container start — never cache it.
    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location ^~ /static/ {
        # Resolve the upstream at request time (Docker's embedded DNS) instead of
        # at config load — otherwise nginx aborts with "host not found in upstream"
        # if web-api hasn't started yet. With a variable in proxy_pass, an
        # unavailable upstream yields a 502 per request rather than killing nginx.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://remnawave-tg-shop-web-api:8090;
        proxy_pass $api_upstream/static/;
        proxy_set_header Host $host;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
